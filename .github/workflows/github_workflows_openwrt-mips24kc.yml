name: Build OpenWrt MIPS 24Kc

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build easytier-core for MIPS 24Kc
    runs-on: ubuntu-24.04

    env:
      CARGO_TERM_COLOR: always
      TARGET: mips-unknown-linux-musl
      MUSL_TARGET: mips-unknown-linux-muslsf

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            lld \
            pkg-config \
            protobuf-compiler \
            curl \
            wget \
            xz-utils \
            gcc \
            g++

      - name: Download MIPS soft-float musl toolchain
        run: |
          mkdir -p "$GITHUB_WORKSPACE/musl_gcc"

          wget --inet4-only -O \
            "$GITHUB_WORKSPACE/musl_gcc/${MUSL_TARGET}.tar.xz" \
            "https://github.com/cross-tools/musl-cross/releases/download/20250520/${MUSL_TARGET}.tar.xz"

          tar -xf \
            "$GITHUB_WORKSPACE/musl_gcc/${MUSL_TARGET}.tar.xz" \
            -C "$GITHUB_WORKSPACE/musl_gcc"

          TOOLCHAIN="$GITHUB_WORKSPACE/musl_gcc/${MUSL_TARGET}"

          echo "TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
          echo "$TOOLCHAIN/bin" >> "$GITHUB_PATH"

          echo "CC=${MUSL_TARGET}-gcc" >> "$GITHUB_ENV"
          echo "CXX=${MUSL_TARGET}-g++" >> "$GITHUB_ENV"
          echo "AR=${MUSL_TARGET}-ar" >> "$GITHUB_ENV"
          echo "RANLIB=${MUSL_TARGET}-ranlib" >> "$GITHUB_ENV"
          echo "STRIP=${MUSL_TARGET}-strip" >> "$GITHUB_ENV"

          echo "CARGO_TARGET_MIPS_UNKNOWN_LINUX_MUSL_LINKER=${MUSL_TARGET}-gcc" >> "$GITHUB_ENV"

          "${MUSL_TARGET}-gcc" --version

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.95
          components: rust-src
          cache: true
          rustflags: ''

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '35.1'
          repo-token: ${{ github.token }}

      - name: Build easytier-core
        env:
          RUSTC_BOOTSTRAP: 1
        run: |
          cargo +1.95 build \
            --release \
            --target "$TARGET" \
            -Z build-std=std,panic_abort \
            --package easytier \
            --bin easytier-core \
            --features jemalloc

      - name: Build easytier-cli
        env:
          RUSTC_BOOTSTRAP: 1
        run: |
          cargo +1.95 build \
            --release \
            --target "$TARGET" \
            -Z build-std=std,panic_abort \
            --package easytier \
            --bin easytier-cli \
            --features jemalloc

      - name: Verify binaries
        run: |
          file target/$TARGET/release/easytier-core
          file target/$TARGET/release/easytier-cli

          test -x target/$TARGET/release/easytier-core
          test -x target/$TARGET/release/easytier-cli

      - name: Prepare artifact
        run: |
          mkdir -p artifact

          cp target/$TARGET/release/easytier-core artifact/
          cp target/$TARGET/release/easytier-cli artifact/

          chmod 0755 artifact/easytier-core
          chmod 0755 artifact/easytier-cli

          tar -czf easytier-openwrt-mips24kc.tar.gz \
            -C artifact \
            easytier-core \
            easytier-cli

          sha256sum \
            artifact/easytier-core \
            artifact/easytier-cli \
            easytier-openwrt-mips24kc.tar.gz \
            > easytier-openwrt-mips24kc.sha256

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: easytier-openwrt-mips24kc
          path: |
            artifact/easytier-core
            artifact/easytier-cli
            easytier-openwrt-mips24kc.tar.gz
            easytier-openwrt-mips24kc.sha256
          if-no-files-found: error