name: Build OpenWrt MIPS 24Kc

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build easytier-core and easytier-cli for MIPS 24Kc
    runs-on: ubuntu-24.04

    env:
      CARGO_TERM_COLOR: always
      TARGET: mips-unknown-linux-musl

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            lld \
            pkg-config \
            protobuf-compiler \
            curl \
            wget \
            xz-utils \
            gcc \
            g++

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.95
          components: rust-src
          cache: true
          rustflags: ''

      - name: Verify Rust environment
        shell: bash
        run: |
          set -euxo pipefail

          rustc +1.95 --version
          cargo +1.95 --version
          rustup +1.95 component list --installed

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '35.1'
          repo-token: ${{ github.token }}

      - name: Download MIPS musl toolchain
        shell: bash
        run: |
          set -euxo pipefail

          WORK="$GITHUB_WORKSPACE/musl_gcc"
          ARCHIVE="$WORK/mips-unknown-linux-muslsf.tar.xz"

          mkdir -p "$WORK"

          wget --inet4-only -O "$ARCHIVE" \
            "https://github.com/cross-tools/musl-cross/releases/download/20250520/mips-unknown-linux-muslsf.tar.xz"

          echo "=== archive listing ==="
          tar -tf "$ARCHIVE" > "$WORK/archive-list.txt"
          sed -n '1,50p' "$WORK/archive-list.txt"

          tar -xf "$ARCHIVE" -C "$WORK"

          echo "=== gcc files ==="
          find "$WORK" -type f -name '*gcc' -print

          GCC_PATH="$(find "$WORK" -type f -name '*gcc' -print -quit)"

          if [ -z "$GCC_PATH" ]; then
            echo "ERROR: no GCC compiler found"
            exit 1
          fi

          TOOLCHAIN_BIN="$(dirname "$GCC_PATH")"
          CROSS_GCC="$(basename "$GCC_PATH")"
          CROSS_PREFIX="${CROSS_GCC%-gcc}"

          echo "GCC_PATH=$GCC_PATH"
          echo "TOOLCHAIN_BIN=$TOOLCHAIN_BIN"
          echo "CROSS_GCC=$CROSS_GCC"
          echo "CROSS_PREFIX=$CROSS_PREFIX"

          echo "$TOOLCHAIN_BIN" >> "$GITHUB_PATH"

          echo "CC=$CROSS_GCC" >> "$GITHUB_ENV"
          echo "CXX=${CROSS_PREFIX}-g++" >> "$GITHUB_ENV"
          echo "AR=${CROSS_PREFIX}-ar" >> "$GITHUB_ENV"
          echo "RANLIB=${CROSS_PREFIX}-ranlib" >> "$GITHUB_ENV"
          echo "STRIP=${CROSS_PREFIX}-strip" >> "$GITHUB_ENV"

          echo "CARGO_TARGET_MIPS_UNKNOWN_LINUX_MUSL_LINKER=$CROSS_GCC" >> "$GITHUB_ENV"

          command -v "$CROSS_GCC"
          "$GCC_PATH" --version

      - name: Configure MIPS target
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p .cargo

          cat > .cargo/config.toml <<EOF
          [target.mips-unknown-linux-musl]
          linker = "${CARGO_TARGET_MIPS_UNKNOWN_LINUX_MUSL_LINKER}"
          ar = "${AR}"
          rustflags = [
            "-C", "target-feature=-mips32r2"
          ]
          EOF

          cat .cargo/config.toml

      - name: Build easytier-core
        shell: bash
        env:
          RUSTC_BOOTSTRAP: 1
        run: |
          set -euxo pipefail

          echo "Using linker: ${CARGO_TARGET_MIPS_UNKNOWN_LINUX_MUSL_LINKER:-unknown}"
          echo "CC=${CC:-unknown}"

          cargo +1.95 build \
            --release \
            --target "$TARGET" \
            -Z build-std=std,panic_abort \
            --package easytier \
            --bin easytier-core \
            --features jemalloc

      - name: Build easytier-cli
        shell: bash
        env:
          RUSTC_BOOTSTRAP: 1
        run: |
          set -euxo pipefail

          cargo +1.95 build \
            --release \
            --target "$TARGET" \
            -Z build-std=std,panic_abort \
            --package easytier \
            --bin easytier-cli \
            --features jemalloc

      - name: Verify binaries
        shell: bash
        run: |
          set -euxo pipefail

          file "target/$TARGET/release/easytier-core"
          file "target/$TARGET/release/easytier-cli"

          test -x "target/$TARGET/release/easytier-core"
          test -x "target/$TARGET/release/easytier-cli"

      - name: Prepare artifact
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p artifact

          cp "target/$TARGET/release/easytier-core" artifact/
          cp "target/$TARGET/release/easytier-cli" artifact/

          chmod 0755 artifact/easytier-core
          chmod 0755 artifact/easytier-cli

          tar -czf easytier-openwrt-mips24kc.tar.gz \
            -C artifact \
            easytier-core \
            easytier-cli

          sha256sum \
            artifact/easytier-core \
            artifact/easytier-cli \
            easytier-openwrt-mips24kc.tar.gz \
            > easytier-openwrt-mips24kc.sha256

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: easytier-openwrt-mips24kc
          path: |
            artifact/easytier-core
            artifact/easytier-cli
            easytier-openwrt-mips24kc.tar.gz
            easytier-openwrt-mips24kc.sha256
          if-no-files-found: error
